  </defs>

  <rect x="0" y="0" width="1800" height="500" rx="28" fill="url(#bg)"/>
  <path d="M0 388H1800" stroke="#14233A" stroke-width="2"/>
  <path d="M0 420H1800" stroke="#122036" stroke-width="2"/>
  <path d="M0 452H1800" stroke="#102034" stroke-width="2"/>

  <g transform="translate(120 82)">
