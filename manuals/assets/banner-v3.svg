    <g transform="translate(0 294)">
      <rect x="0" y="0" width="620" height="70" rx="12" fill="#07111D" stroke="#223552" stroke-width="2"/>
      <text x="24" y="44"
        font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="22" font-weight="700" fill="#22D3EE">$</text>
      <text x="56" y="44"
        font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="22" font-weight="700" fill="#E7EEF6">serverkit</text>
      <text x="206" y="44"
        font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
