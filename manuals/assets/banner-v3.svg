      <line x1="30" y1="130" x2="340" y2="130" stroke="#1D2D46" stroke-width="2"/>

      <text x="30" y="170" fill="#71839A">UFW</text>
      <text x="340" y="170" text-anchor="end" font-weight="800" fill="#22D3EE">ACTIVE</text>
      <line x1="30" y1="188" x2="340" y2="188" stroke="#1D2D46" stroke-width="2"/>

      <text x="30" y="228" fill="#71839A">FAIL2BAN</text>
