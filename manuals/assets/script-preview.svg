  </defs>

  <rect width="1520" height="760" rx="28" fill="#060A11"/>
  <rect x="24" y="24" width="1472" height="712" rx="22" fill="url(#bg)" stroke="#1F2D45" stroke-width="2"/>

  <g transform="translate(66 56)">
