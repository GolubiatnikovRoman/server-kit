<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="760" viewBox="0 0 1520 760">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#121920"/>
    </linearGradient>
  </defs>

  <rect width="1520" height="760" rx="28" fill="#080B0F"/>
  <rect x="26" y="26" width="1468" height="708" rx="22" fill="url(#panel)" stroke="#202A35" stroke-width="2"/>

  <g transform="translate(74 70)">
    <text x="0" y="44" fill="#F1F5F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">SERVER-KIT</text>
    <text x="0" y="78" fill="#7C8996" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">v1.0.0 · Управление Linux-сервером</text>
  </g>

  <g transform="translate(74 176)">
    <rect x="0" y="0" width="640" height="430" rx="18" fill="#0D1319" stroke="#1F2A35"/>
    <text x="28" y="48" fill="#7EE787" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ОСНОВНЫЕ РАЗДЕЛЫ</text>

    <g font-family="monospace" font-size="22">
      <text x="30" y="100" fill="#6EDB8F">01</text><text x="88" y="100" fill="#D4DCE4">SSH</text>
      <text x="30" y="142" fill="#6EDB8F">02</text><text x="88" y="142" fill="#D4DCE4">Межсетевой экран</text>
      <text x="30" y="184" fill="#6EDB8F">03</text><text x="88" y="184" fill="#D4DCE4">Безопасность</text>
      <text x="30" y="226" fill="#6EDB8F">04</text><text x="88" y="226" fill="#D4DCE4">Обновления системы</text>
      <text x="30" y="268" fill="#6EDB8F">05</text><text x="88" y="268" fill="#D4DCE4">Мониторинг</text>
      <text x="30" y="310" fill="#6EDB8F">06</text><text x="88" y="310" fill="#D4DCE4">Службы</text>
      <text x="30" y="352" fill="#6EDB8F">07</text><text x="88" y="352" fill="#D4DCE4">Docker</text>
      <text x="30" y="394" fill="#6EDB8F">08</text><text x="88" y="394" fill="#D4DCE4">Screen-сессии</text>
    </g>

    <rect x="680" y="0" width="690" height="430" rx="18" fill="#0D1319" stroke="#1F2A35"/>
    <text x="708" y="48" fill="#7EE787" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">СОСТОЯНИЕ СЕРВЕРА</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
      <text x="708" y="104" fill="#7C8996">SSH</text><text x="1260" y="104" text-anchor="end" fill="#93E6A6">защищён</text>
      <line x1="708" y1="120" x2="1260" y2="120" stroke="#1B2530"/>
      <text x="708" y="158" fill="#7C8996">Firewall</text><text x="1260" y="158" text-anchor="end" fill="#93E6A6">включён</text>
      <line x1="708" y1="174" x2="1260" y2="174" stroke="#1B2530"/>
      <text x="708" y="212" fill="#7C8996">Fail2ban</text><text x="1260" y="212" text-anchor="end" fill="#93E6A6">работает</text>
      <line x1="708" y1="228" x2="1260" y2="228" stroke="#1B2530"/>
      <text x="708" y="266" fill="#7C8996">Docker</text><text x="1260" y="266" text-anchor="end" fill="#D3DCE5">установлен</text>
      <line x1="708" y1="282" x2="1260" y2="282" stroke="#1B2530"/>
      <text x="708" y="320" fill="#7C8996">Backup</text><text x="1260" y="320" text-anchor="end" fill="#93E6A6">готов</text>
      <line x1="708" y1="336" x2="1260" y2="336" stroke="#1B2530"/>
      <text x="708" y="374" fill="#7C8996">Обновления</text><text x="1260" y="374" text-anchor="end" fill="#E7C66F">3 доступны</text>
    </g>
  </g>

  <g transform="translate(74 640)">
    <rect x="0" y="0" width="1370" height="58" rx="14" fill="#0A1016" stroke="#1F2A35"/>
    <text x="24" y="37" fill="#6EDB8F" font-family="monospace" font-size="20">$</text>
    <text x="50" y="37" fill="#D4DCE4" font-family="monospace" font-size="20">serverkit</text>
    <text x="170" y="37" fill="#637180" font-family="monospace" font-size="18"># единая точка управления сервером</text>
  </g>
</svg>